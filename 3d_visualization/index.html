<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vision2Scale — 3D Terrain Viewer</title>
<style>
  :root {
    --panel-bg: rgba(15, 17, 21, 0.72);
    --panel-border: rgba(255, 255, 255, 0.1);
    --accent: #4fc3f7;
    --text: #e8eaed;
    --text-dim: #9aa0a6;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0c10;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  #app-canvas {
    position: fixed;
    inset: 0;
    display: block;
  }
  .panel {
    position: fixed;
    z-index: 10;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
  }
  #controls-panel {
    top: 16px;
    left: 16px;
    width: 240px;
  }
  #hint-panel {
    top: 16px;
    right: 16px;
    max-width: 260px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-dim);
  }
  #status-panel {
    bottom: 16px;
    left: 16px;
    font-size: 12px;
    color: #ff6b6b;
    display: none;
    max-width: 420px;
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  #mode-toggle {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--panel-border);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  #mode-toggle:hover {
    background: rgba(255, 255, 255, 0.12);
  }
  #mode-toggle .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    box-shadow: 0 0 6px var(--accent);
  }
  .slider-row {
    margin-top: 16px;
  }
  .slider-row label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .slider-row output {
    color: var(--accent);
    font-weight: 600;
  }
  #exaggeration-slider {
    width: 100%;
    accent-color: var(--accent);
  }
</style>
</head>
<body>
<canvas id="app-canvas"></canvas>

<div id="controls-panel" class="panel">
  <h2>Navigation</h2>
  <button id="mode-toggle" type="button"><span class="dot"></span><span id="mode-label">Orbit Mode</span></button>
  <div class="slider-row">
    <label for="exaggeration-slider">
      <span>Vertical Exaggeration</span>
      <output id="exaggeration-value">1.5x</output>
    </label>
    <input id="exaggeration-slider" type="range" min="0.5" max="4.0" step="0.1" value="1.5" />
  </div>
</div>

<div id="hint-panel" class="panel">
  <h2>Controls</h2>
  <div><strong>Orbit:</strong> Left-drag to rotate, scroll to zoom, right-drag to pan.</div>
  <div style="margin-top:6px;"><strong>Fly:</strong> WASD to move, drag mouse to look, Q/E to roll.</div>
</div>

<div id="status-panel" class="panel"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from 'three';
  import { createTerrainMesh } from './terrain.js';
  import { setupNavigation } from './controls.js';

  const canvas = document.getElementById('app-canvas');
  const modeToggle = document.getElementById('mode-toggle');
  const modeLabel = document.getElementById('mode-label');
  const exaggerationSlider = document.getElementById('exaggeration-slider');
  const exaggerationValue = document.getElementById('exaggeration-value');
  const statusPanel = document.getElementById('status-panel');

  function showError(message) {
    statusPanel.textContent = message;
    statusPanel.style.display = 'block';
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0c10);
  scene.fog = new THREE.Fog(0x0b0c10, 600, 2000);

  const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    5000
  );
  camera.position.set(160, 140, 180);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xfff2d9, 2.2);
  sunLight.position.set(220, 280, 140);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  sunLight.shadow.camera.near = 10;
  sunLight.shadow.camera.far = 1000;
  sunLight.shadow.camera.left = -250;
  sunLight.shadow.camera.right = 250;
  sunLight.shadow.camera.top = 250;
  sunLight.shadow.camera.bottom = -250;
  sunLight.shadow.bias = -0.0015;
  scene.add(sunLight);

  const nav = setupNavigation(camera, renderer.domElement);

  function refreshModeUI() {
    const mode = nav.getMode();
    modeLabel.textContent = mode === 'orbit' ? 'Orbit Mode' : 'Fly Mode';
  }
  refreshModeUI();

  modeToggle.addEventListener('click', () => {
    nav.setMode(nav.getMode() === 'orbit' ? 'fly' : 'orbit');
    refreshModeUI();
  });

  let terrain = null;

  exaggerationSlider.addEventListener('input', () => {
    const factor = parseFloat(exaggerationSlider.value);
    exaggerationValue.textContent = `${factor.toFixed(1)}x`;
    if (terrain) terrain.setVerticalExaggeration(factor);
  });

  (async function init() {
    try {
      terrain = await createTerrainMesh(
        './assets/elevation_16bit.png',
        './assets/metadata.json',
        './assets/satellite.jpg',
        {
          baseSize: 300,
          segmentsX: 256,
          segmentsY: 256,
          verticalExaggeration: parseFloat(exaggerationSlider.value),
          renderer,
        }
      );
      scene.add(terrain.mesh);
    } catch (err) {
      console.error(err);
      showError(`Failed to load terrain assets: ${err.message}`);
    }
  })();

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    nav.update(delta);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
