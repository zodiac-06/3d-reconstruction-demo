<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vision2Scale - 3D Viewer</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            background-color: #121212; 
            color: #ffffff; 
        }
        #ui-panel { 
            padding: 20px; 
            background: #1e1e1e; 
            border-bottom: 1px solid #333; 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            z-index: 10; 
        }
        h2 { margin: 0; color: #4CAF50; font-size: 1.5rem; letter-spacing: 1px; }
        input[type="file"] { 
            background: #2d2d2d; 
            padding: 8px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            color: #fff; 
        }
        button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s; 
        }
        button:hover { background: #45a049; transform: scale(1.05); }
        #status { flex-grow: 1; text-align: right; font-size: 0.9rem; color: #aaa; font-style: italic; }
        .data-readout { 
            background: #000; 
            border: 1px solid #4CAF50;
            padding: 8px 12px; 
            border-radius: 6px; 
            color: #4CAF50; 
            font-family: monospace; 
            font-size: 1.1rem; 
        }
        #viewer { flex-grow: 1; width: 100%; background: radial-gradient(circle, #333 0%, #000 100%); }
    </style>
    <!-- Three.js and loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>Vision2Scale Viewer</h2>
        <input type="file" id="imageUpload" accept="image/png, image/jpeg">
        <!-- Track C's POST /jobs requires a real measured reference length + which
             bbox axis it corresponds to -- there is no default, a fabricated scale
             factor is worse than asking the user for this. -->
        <input type="number" id="referenceLengthM" step="0.001" min="0" placeholder="Reference length (m)" style="width: 130px;">
        <select id="referenceAxis">
            <option value="width" selected>width</option>
            <option value="height">height</option>
            <option value="depth">depth</option>
        </select>
        <!-- Button updated to call the real API function -->
        <button onclick="startRealPipeline()">Process Image</button>
        <span id="status">Status: Waiting for upload...</span>
        <div style="margin-top: 10px;">
            Estimated Height: <span id="measurement" class="data-readout">-- meters</span>
        </div>
    </div>

    <div id="viewer"></div>

    <script>
        // 1. Scene Setup
        const container = document.getElementById('viewer');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // 2. Lighting & Controls
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.z = 5;

        // 3. Render Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 4. Real API Integration Logic
        async function startRealPipeline() {
            const fileInput = document.getElementById('imageUpload');
            
            if (fileInput.files.length === 0) {
                alert("Please select an image first!");
                return;
            }
            
            const referenceLengthM = document.getElementById('referenceLengthM').value;
            if (!referenceLengthM) {
                alert("Enter the real measured reference length (meters) first!");
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('photo', file); // Updated from 'file' to 'photo' to match Track C
            formData.append('reference_length_m', referenceLengthM);
            formData.append('reference_axis', document.getElementById('referenceAxis').value);

            document.getElementById('status').innerText = "Status: Uploading to Track C API...";

            try {
                // Hit POST /jobs to create the job (relative -- same origin as
                // this page once Track C mounts this frontend and serves both)
                const response = await fetch('/jobs', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error("Upload failed");
                
                const data = await response.json();
                const jobId = data.job_id || data.id; 
                
                // Start polling the status
                pollJobStatus(jobId);
                
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "Error: Could not connect to backend API.";
            }
        }

        async function pollJobStatus(jobId) {
            document.getElementById('status').innerText = `Status: Processing job ${jobId}...`;
            
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`/jobs/${jobId}`);
                    const jobData = await res.json();
                    
                    if (jobData.status === "done") {
                        clearInterval(interval);
                        document.getElementById('status').innerText = "Status: Done! Rendering real mesh.";
                        loadRealMesh(jobId);
                    } else if (jobData.status === "failed") {
                        clearInterval(interval);
                        document.getElementById('status').innerText = "Status: Job failed on backend. Check Track C logs.";
                    }
                } catch (e) {
                    clearInterval(interval);
                    document.getElementById('status').innerText = "Error: Connection lost while polling.";
                }
            }, 2000); 
        }

        function loadRealMesh(jobId) {
            const meshUrl = `/jobs/${jobId}/result`;

            const loader = new THREE.OBJLoader();
            loader.load(
                meshUrl,
                function (object) {
                    // Clear the old object before adding the new one
                    while(scene.children.length > 2){
                        scene.remove(scene.children[2]);
                    }
                    scene.add(object);
                    frameObject(object);
                },
                function (xhr) {
                    console.log((xhr.loaded / xhr.total * 100) + '% loaded');
                },
                function (error) {
                    console.error('Error loading mesh from API.', error);
                }
            );
        }

        // Fits the camera to the loaded mesh so it fills ~70% of the viewport,
        // instead of sitting at the fixed camera.position.z = 5 default (which
        // makes a correctly-meter-scaled real-world object look like a speck).
        //
        // A single vertical-FOV/bbox-diagonal estimate isn't enough: it ignores
        // the viewport's aspect ratio and the object's actual silhouette from
        // this specific 3/4 viewing angle (a tall-but-narrow mesh and a
        // wide-but-flat one need different distances for the same bbox
        // diagonal). So this projects the box corners with the real camera
        // and iterates a few times until the worst-case screen axis hits the
        // target fill ratio.
        function frameObject(object) {
            const box = new THREE.Box3().setFromObject(object);
            if (box.isEmpty()) return;

            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z, 1e-6);
            const direction = new THREE.Vector3(1, 0.75, 1).normalize();
            const fitRatio = 0.7; // mesh should fill ~70% of the viewport, not 100%

            camera.near = Math.max(maxDim / 100, 0.001);
            camera.far = maxDim * 100;

            const corners = [];
            for (const x of [box.min.x, box.max.x])
                for (const y of [box.min.y, box.max.y])
                    for (const z of [box.min.z, box.max.z])
                        corners.push(new THREE.Vector3(x, y, z));

            const fovRad = camera.fov * (Math.PI / 180);
            let distance = (maxDim / (2 * Math.tan(fovRad / 2))) / fitRatio;

            for (let i = 0; i < 5; i++) {
                camera.position.copy(center).addScaledVector(direction, distance);
                camera.lookAt(center);
                camera.updateProjectionMatrix();
                camera.updateMatrixWorld(true);

                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                for (const c of corners) {
                    const p = c.clone().project(camera); // NDC: [-1, 1] spans the full viewport
                    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
                    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
                }
                const worstFraction = Math.max((maxX - minX) / 2, (maxY - minY) / 2);
                if (worstFraction < 1e-6) break;
                distance *= worstFraction / fitRatio;
            }

            controls.target.copy(center);
            controls.update();
        }
    </script>
</body>
</html>
