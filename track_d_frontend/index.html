<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vision2Scale - 3D Viewer</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            background-color: #121212; 
            color: #ffffff; 
        }
        #ui-panel { 
            padding: 20px; 
            background: #1e1e1e; 
            border-bottom: 1px solid #333; 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            z-index: 10; 
        }
        h2 { margin: 0; color: #4CAF50; font-size: 1.5rem; letter-spacing: 1px; }
        input[type="file"] { 
            background: #2d2d2d; 
            padding: 8px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            color: #fff; 
        }
        button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s; 
        }
        button:hover { background: #45a049; transform: scale(1.05); }
        #status { flex-grow: 1; text-align: right; font-size: 0.9rem; color: #aaa; font-style: italic; }
        .data-readout { 
            background: #000; 
            border: 1px solid #4CAF50;
            padding: 8px 12px; 
            border-radius: 6px; 
            color: #4CAF50; 
            font-family: monospace; 
            font-size: 1.1rem; 
        }
        #viewer { flex-grow: 1; width: 100%; background: radial-gradient(circle, #333 0%, #000 100%); }
    </style>
    <!-- Three.js and loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>Vision2Scale Viewer</h2>
        <input type="file" id="imageUpload" accept="image/png, image/jpeg">
        <!-- Button updated to call the real API function -->
        <button onclick="startRealPipeline()">Process Image</button>
        <span id="status">Status: Waiting for upload...</span>
        <div style="margin-top: 10px;">
            Estimated Height: <span id="measurement" class="data-readout">-- meters</span>
        </div>
    </div>

    <div id="viewer"></div>

    <script>
        // 1. Scene Setup
        const container = document.getElementById('viewer');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // 2. Lighting & Controls
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.z = 5;

        // 3. Render Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 4. Real API Integration Logic
        async function startRealPipeline() {
            const fileInput = document.getElementById('imageUpload');
            
            if (fileInput.files.length === 0) {
                alert("Please select an image first!");
                return;
            }
            
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file); 

            document.getElementById('status').innerText = "Status: Uploading to Track C API...";

            try {
                // Hit POST /jobs to create the job
                const response = await fetch('http://127.0.0.1:8000/jobs', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error("Upload failed");
                
                const data = await response.json();
                const jobId = data.id || data.job_id; 
                
                // Start polling the status
                pollJobStatus(jobId);
                
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "Error: Could not connect to backend API.";
            }
        }

        async function pollJobStatus(jobId) {
            document.getElementById('status').innerText = `Status: Processing job ${jobId}...`;
            
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`http://127.0.0.1:8000/jobs/${jobId}`);
                    const jobData = await res.json();
                    
                    if (jobData.status === "done") {
                        clearInterval(interval);
                        document.getElementById('status').innerText = "Status: Done! Rendering real mesh.";
                        loadRealMesh(jobId);
                    } else if (jobData.status === "failed") {
                        clearInterval(interval);
                        document.getElementById('status').innerText = "Status: Job failed on backend. Check Track C logs.";
                    }
                } catch (e) {
                    clearInterval(interval);
                    document.getElementById('status').innerText = "Error: Connection lost while polling.";
                }
            }, 2000); 
        }

        function loadRealMesh(jobId) {
            const meshUrl = `http://127.0.0.1:8000/jobs/${jobId}/result`;
            
            const loader = new THREE.OBJLoader();
            loader.load(
                meshUrl, 
                function (object) {
                    // Clear the old object before adding the new one
                    while(scene.children.length > 2){ 
                        scene.remove(scene.children[2]); 
                    }
                    scene.add(object);
                },
                function (xhr) {
                    console.log((xhr.loaded / xhr.total * 100) + '% loaded');
                },
                function (error) {
                    console.error('Error loading mesh from API.', error);
                }
            );
        }
    </script>
</body>
</html>
