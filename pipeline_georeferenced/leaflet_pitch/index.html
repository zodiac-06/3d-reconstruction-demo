<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DepthWizard — AOI Context Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; background: #0b0c10; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: fixed; inset: 0; top: var(--nav-h, 0px); }
  #map.selecting { cursor: crosshair; }
  .panel {
    position: fixed; z-index: 1000; top: calc(var(--nav-h, 0px) + 16px); left: 16px;
    background: rgba(15, 17, 21, 0.85); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 14px 16px; color: #e8eaed;
    max-width: 320px; box-shadow: 0 4px 24px rgba(0,0,0,0.35);
  }
  .panel h1 { margin: 0 0 6px; font-size: 15px; }
  .panel h2 { margin: 14px 0 6px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 13px; }
  .panel p { margin: 4px 0; font-size: 12px; color: #9aa0a6; line-height: 1.4; }
  .panel code { color: #4fc3f7; font-size: 11px; }
  #open-3d {
    display: inline-block; margin-top: 10px; padding: 10px 14px;
    background: #4fc3f7; color: #0b0c10; font-weight: 700; font-size: 13px;
    text-decoration: none; border-radius: 6px; text-align: center; width: 100%;
    box-sizing: border-box;
  }
  #open-3d:hover { background: #7bd3fa; }
  #open-3d.disabled { background: #444; color: #999; pointer-events: none; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row button { flex: 1; padding: 9px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.15); background: #263238; color: #4fc3f7; }
  .row button:hover:not(:disabled) { background: #37474f; }
  .row button.active { background: #4fc3f7; color: #0b0c10; }
  #generate { background: #4fc3f7; color: #0b0c10; border-color: transparent; }
  #generate:hover:not(:disabled) { background: #7bd3fa; }
  .row button:disabled { background: #333; color: #888; border-color: transparent; cursor: not-allowed; }
  #box-info.over { color: #ff6b6b; }
  #box-info b { color: #e8eaed; font-weight: 600; }
  #box-info.over b { color: #ff6b6b; }
  #accuracy-note { color: #ffd54f; }
  #job-status { min-height: 1em; }
  #job-status.failed { color: #ff6b6b; }
  #job-status.done { color: #81c784; }
  #status { position: fixed; z-index: 1000; bottom: 16px; left: 16px; font-size: 12px; color: #ff6b6b; display: none; max-width: 420px; background: rgba(15,17,21,0.85); padding: 10px 14px; border-radius: 8px; }
</style>
<script src="/site/nav.js" defer></script>
</head>
<body data-nav="overlay">
<div id="map"></div>
<div class="panel">
  <h1 id="aoi-title">AOI context map</h1>
  <p id="aoi-summary">Loading real AOI bounds from <code>geo_metadata.json</code>…</p>
  <a id="open-3d" class="disabled" href="../3d_visualization/index.html">Open 3D terrain flythrough →</a>

  <h2>3D terrain for a new area</h2>
  <p>Select an area, then drag a rectangle on the map.</p>
  <div class="row">
    <button type="button" id="select-toggle">Select area</button>
    <button type="button" id="generate" disabled>Generate 3D</button>
  </div>
  <p id="box-info">No area selected.</p>
  <p id="accuracy-note"></p>
  <p id="job-status"></p>
</div>
<div id="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/validation/headline.js"></script>
<script>
  // Largest box (degrees per side) the page will submit. Measured with the
  // real pipeline: a 0.10 degree box (985 x 1121 px) took 18.6 s end to end;
  // larger boxes were not measured, so they aren't offered. The server's own
  // limit is 0.5 degrees (main.py MAX_BOUNDS_SIDE_DEG).
  const MAX_SIDE_DEG = 0.10;
  const POLL_MS = 2000;

  function showError(message) {
    const el = document.getElementById('status');
    el.textContent = message;
    el.style.display = 'block';
  }

  const map = L.map('map', { zoomControl: false }).setView([29.38, 79.46], 12);
  L.control.zoom({ position: 'bottomright' }).addTo(map);  // top-left is under the info panel

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);

  (async function init() {
    try {
      // Real AOI bounds, not hardcoded -- from Person 1's actual pipeline output.
      const res = await fetch('../qgis_prep/data/geo_metadata.json');
      if (!res.ok) throw new Error(`Failed to load geo_metadata.json: ${res.status} ${res.statusText}`);
      const meta = await res.json();
      const b = meta.bounds_epsg4326;
      if (!b || typeof b.south !== 'number') {
        throw new Error('geo_metadata.json is missing bounds_epsg4326');
      }

      const bounds = L.latLngBounds([b.south, b.west], [b.north, b.east]);

      L.rectangle(bounds, {
        color: '#4fc3f7',
        weight: 2,
        fillColor: '#4fc3f7',
        fillOpacity: 0.12,
      }).addTo(map);

      map.fitBounds(bounds, { padding: [40, 40] });

      // Title from the AOI actually processed (its centre), not a fixed
      // place name -- the pipeline accepts any bounds, not just Nainital.
      const fmt = (v, pos, neg) => `${Math.abs(v).toFixed(3)}°${v >= 0 ? pos : neg}`;
      const centre = `${fmt((b.south + b.north) / 2, 'N', 'S')}, ${fmt((b.west + b.east) / 2, 'E', 'W')}`;
      document.getElementById('aoi-title').textContent = `AOI at ${centre} — context map`;
      document.title = `DepthWizard — AOI at ${centre}`;

      const summary = document.getElementById('aoi-summary');
      summary.innerHTML =
        `Real bounding box actually processed:<br>` +
        `<code>${b.west.toFixed(4)}, ${b.south.toFixed(4)}, ${b.east.toFixed(4)}, ${b.north.toFixed(4)}</code><br>` +
        `(west, south, east, north — EPSG:4326)`;

      document.getElementById('open-3d').classList.remove('disabled');
    } catch (err) {
      console.error(err);
      showError(`Failed to load AOI metadata: ${err.message}`);
    }
  })();

  // ----- Select an area and generate its 3D terrain -----
  const mapEl = document.getElementById('map');
  const selectBtn = document.getElementById('select-toggle');
  const generateBtn = document.getElementById('generate');
  const boxInfo = document.getElementById('box-info');
  const accuracyNote = document.getElementById('accuracy-note');
  const jobStatus = document.getElementById('job-status');

  let selecting = false, dragStart = null, selRect = null, box = null, running = false;

  // Accuracy label: the precomputed ICESat-2 rows and their half-overlap rule
  // (validation/headline.js), the same match the upload page uses.
  let precomputed = null;
  fetch('/validation/icesat2_precomputed.json').then(r => (r.ok ? r.json() : null))
    .then(t => { precomputed = t; updateBox(); }).catch(() => {});

  function setSelecting(on) {
    selecting = on;
    selectBtn.classList.toggle('active', on);
    selectBtn.textContent = on ? 'Drag on the map…' : 'Select area';
    mapEl.classList.toggle('selecting', on);
    // Leaflet starts a pan on mousedown, so dragging is off for the whole select mode.
    if (on) map.dragging.disable(); else map.dragging.enable();
  }

  function sizeKm(b) {
    const midLat = (b.south + b.north) / 2 * Math.PI / 180;
    return { w: (b.east - b.west) * 111.32 * Math.cos(midLat), h: (b.north - b.south) * 110.57 };
  }

  function updateBox() {
    if (!box) {
      boxInfo.textContent = 'No area selected.';
      boxInfo.classList.remove('over');
      accuracyNote.textContent = '';
      generateBtn.disabled = true;
      return;
    }
    const dLon = box.east - box.west, dLat = box.north - box.south, km = sizeKm(box);
    const over = dLon > MAX_SIDE_DEG || dLat > MAX_SIDE_DEG;
    boxInfo.classList.toggle('over', over);
    boxInfo.innerHTML = `<b>${km.w.toFixed(2)} × ${km.h.toFixed(2)} km</b> (${dLon.toFixed(4)}° × ${dLat.toFixed(4)}°)` +
      (over ? `<br>Too large: at most ${MAX_SIDE_DEG}° per side, so processing stays under about a minute.` : '');
    if (selRect) selRect.setStyle({ color: over ? '#ff6b6b' : '#ffd54f', fillColor: over ? '#ff6b6b' : '#ffd54f' });
    const aoi = precomputed && typeof matchPrecomputedAoi === 'function' ? matchPrecomputedAoi(box, precomputed) : null;
    accuracyNote.textContent = aoi
      ? `Overlaps ${aoi.name}: accuracy there was measured offline vs ICESat-2 (RMSE ${aoi.rmse_canopy_top_m} m vs canopy top, ` +
        `${aoi.rmse_ground_m} m vs ground), not for this exact box.`
      : 'Terrain from Copernicus DEM; accuracy not validated for this area.';
    generateBtn.disabled = over || running;
  }

  function boxFrom(a, b) {
    const ll = L.latLngBounds(a, b);
    return { west: ll.getWest(), south: ll.getSouth(), east: ll.getEast(), north: ll.getNorth() };
  }

  function drawBox(a, b) {
    box = boxFrom(a, b);
    const ll = [[box.south, box.west], [box.north, box.east]];
    if (selRect) selRect.setBounds(ll);
    else selRect = L.rectangle(ll, { weight: 2, fillOpacity: 0.15, interactive: false }).addTo(map);
    updateBox();
  }

  selectBtn.addEventListener('click', () => { if (!running) setSelecting(!selecting); });
  map.on('mousedown', e => {
    if (!selecting) return;
    dragStart = e.latlng;
    drawBox(dragStart, dragStart);
  });
  map.on('mousemove', e => { if (selecting && dragStart) drawBox(dragStart, e.latlng); });
  map.on('mouseup', e => {
    if (!selecting || !dragStart) return;
    drawBox(dragStart, e.latlng);
    dragStart = null;
    setSelecting(false);  // restores map dragging
  });

  function setJobStatus(text, cls = '') {
    jobStatus.textContent = text;
    jobStatus.className = cls;
  }

  async function generate() {
    if (running || !box || generateBtn.disabled) return;
    running = true;
    generateBtn.disabled = true;
    selectBtn.disabled = true;
    setJobStatus('Submitting…');
    const form = new FormData();
    for (const k of ['west', 'south', 'east', 'north']) form.append(k, box[k].toFixed(6));
    const t0 = Date.now();
    try {
      const res = await fetch('/jobs?wait=false', { method: 'POST', body: form });
      let job = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(`Rejected (HTTP ${res.status}): ${job.detail || res.statusText}`);
      while (job.status === 'queued' || job.status === 'running') {
        const secs = Math.round((Date.now() - t0) / 1000);
        setJobStatus(job.status === 'queued' ? `Queued behind another job… ${secs} s`
          : `Running: Sentinel-2 fetch, DEM, depth model, fusion… ${secs} s`);
        await new Promise(r => setTimeout(r, POLL_MS));
        const poll = await fetch(`/jobs/${encodeURIComponent(job.id)}`);
        if (!poll.ok) {
          const body = await poll.json().catch(() => ({}));
          throw new Error(`Server error reading job ${job.id} (HTTP ${poll.status}): ${body.detail || poll.statusText}`);
        }
        job = await poll.json();
      }
      if (job.status !== 'done') throw new Error(`Job failed: ${job.error || 'no error message from the server'}`);
      setJobStatus(`Done in ${Math.round((Date.now() - t0) / 1000)} s. Opening the 3D terrain…`, 'done');
      // The viewer draws the latest job's output; ?job= ties its confidence and
      // provenance layers to this job (3d_visualization/index.html findJob).
      location.href = `/3d_visualization/index.html?job=${encodeURIComponent(job.id)}`;
    } catch (err) {
      setJobStatus(err.message, 'failed');
      running = false;
      selectBtn.disabled = false;
      updateBox();
    }
  }
  generateBtn.addEventListener('click', generate);
</script>
</body>
</html>
